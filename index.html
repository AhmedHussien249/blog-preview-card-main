<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>

  <main>
    <article class="card">
      <img src="assets/images/illustration-article.svg" alt="Article Illustration" class="card-img">

      <div class="card-content">
        <span class="tag">Learning</span>
        <p class="date">Published 21 Dec 2023</p>
        <h1 class="title"><a href="#">HTML & CSS foundations</a></h1>
        <p class="description">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </p>
      </div>

      <div class="author">
        <img src="assets/images/image-avatar.webp" alt="Greg Hooper" class="avatar">
        <span class="author-name">Greg Hooper</span>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://github.com/AhmedHussien249" target="_blank">Ahmed Hussien</a>.
  </footer>

</body>
</html>
